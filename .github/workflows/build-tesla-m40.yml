name: Build Windows CUDA Tesla M40

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup CUDA
        uses: Jimver/cuda-toolkit@v0.2.27
        with:
          cuda: '12.4.1'
          method: network

      - name: Configure
        shell: pwsh
        run: |
          cmake -B build `
            -DGGML_CUDA=ON `
            -DCMAKE_CUDA_ARCHITECTURES=52

      - name: Build
        shell: pwsh
        run: |
          cmake --build build --config Release -j 2

      - name: Pack
        shell: pwsh
        run: |
          Compress-Archive `
            -Path build/bin/Release/* `
            -DestinationPath llama-tesla-m40-windows.zip

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: llama-tesla-m40-windows
          path: llama-tesla-m40-windows.zip
